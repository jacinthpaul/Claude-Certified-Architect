name: Deploy Exam Prep Consoles to GitHub Pages

# Publishes BOTH static consoles as one Pages site:
#   /            -> ui/console            (Claude Certified Architect – Foundations)
#   /associate/  -> ui/console-associate  (Claude Certified Associate – Foundations)
# Each console loads React/Babel from a CDN and runs fully client-side from the
# content baked into its assets/data.js — no backend needed on Pages.

on:
  push:
    branches:
      - claude/architect-exam-codebase-7ytdjz
      - claude/associate-foundations-course-plan-aiqsgq
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage both consoles into one site
        run: |
          mkdir -p _site/associate
          cp -r ui/console/. _site/
          cp -r ui/console-associate/. _site/associate/
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
